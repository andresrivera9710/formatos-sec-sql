name: Deploy - Azure App Service (Linux Node.js)

on:
  workflow_dispatch:
    inputs:
      webapp_name:
        description: 'Nombre del Azure Web App (default: sio-prod / sio.laats.net)'
        required: false
        default: 'sio-prod'
      slot_name:
        description: 'Deployment Slot opcional (ej. staging; vacío = production)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validar, Empaquetar y Desplegar en Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar suite completa CI (Seguridad, CSP, Sintaxis y Unit)
        run: npm test

      - name: Limpiar dependencias de desarrollo para producción
        run: npm prune --omit=dev

      - name: Verificar secretos requeridos de Azure App Service
        env:
          APP_NAME: ${{ inputs.webapp_name || vars.AZURE_WEBAPP_NAME || 'sio-prod' }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "${APP_NAME:-}" ]; then
            echo "::error::Falta definir el nombre del Web App (input webapp_name o Repository Variable AZURE_WEBAPP_NAME)."
            exit 1
          fi
          if [ -z "${PUBLISH_PROFILE:-}" ]; then
            echo "::error::Falta configurar el Repository Secret AZURE_WEBAPP_PUBLISH_PROFILE."
            exit 1
          fi

      - name: Preparar paquete limpio de despliegue
        run: |
          rm -rf deploy_pkg
          mkdir -p deploy_pkg
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='deploy_pkg' \
              --exclude='release' \
              --exclude='.firmas-cache' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='GEMINI.md' \
              --exclude='readmegithub.md' \
              -cf - . | tar -xf - -C deploy_pkg

      - name: Desplegar en Azure App Service
        id: deploy_azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.webapp_name || vars.AZURE_WEBAPP_NAME || 'sio-prod' }}
          slot-name: ${{ inputs.slot_name || 'production' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy_pkg

      - name: Smoke Test (/api/health)
        env:
          DEPLOY_URL: ${{ steps.deploy_azure.outputs.webapp-url }}
        run: |
          if [ -n "${DEPLOY_URL:-}" ]; then
            echo "Verificando salud en ${DEPLOY_URL}/api/health ..."
            for i in 1 2 3 4 5; do
              if curl -fsS "${DEPLOY_URL}/api/health"; then
                echo ""
                echo "✔ Healthcheck aprobado."
                exit 0
              fi
              echo "Esperando arranque de App Service (intento ${i}/5)..."
              sleep 10
            done
            echo "::warning::No se obtuvo respuesta 200 inmediata en /api/health; revisar Log Stream en Azure Portal."
          fi
