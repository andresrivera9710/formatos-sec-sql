name: CI - Calidad, Seguridad CSP y Tests SEC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Verificación Estática, CSP y Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '24.x']

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Auditoría de seguridad, .gitignore y CSP en EJS
        run: npm run ci:security

      - name: Validación de sintaxis JS y compilación EJS
        run: npm run ci:syntax

      - name: Pruebas unitarias offline (Catálogo, Validación 400 y HTML Previews)
        run: npm run ci:unit

  dependency-audit:
    name: Auditoría de Dependencias de Producción
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Auditoría npm (nivel high+)
        run: npm audit --omit=dev --audit-level=high
